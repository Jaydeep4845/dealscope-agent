[project]
name = "dealscope-agent"
version = "0.1.0"
description = "LangGraph research agent that turns a company name into a validated deal-sourcing brief."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jaydeep Chavda" }]
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "langgraph>=0.2",
    "mcp>=1.2",
    "langfuse>=2.50",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
