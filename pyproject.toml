[project]
name = "dealscope-agent"
version = "0.1.0"
description = "LangGraph research agent that turns a company name into a validated deal-sourcing brief."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jaydeep Chavda" }]
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "langgraph>=0.2",
    "mcp>=1.2",
    "langfuse>=2.50",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]
embeddings = [
    "beautifulsoup4>=4.12",
    "datasets>=3.0",
    "huggingface_hub>=0.26",
    "sentence-transformers>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]  # Kaggle notebook is generated from embeddings/finetune.py

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"demo-gradio/app.py" = ["E501"]  # HTML and Markdown templates

[tool.pytest.ini_options]
testpaths = ["tests"]
